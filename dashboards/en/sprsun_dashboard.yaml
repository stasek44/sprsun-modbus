      - type: grid
        cards:
          - type: heading
            heading: Lever 1 — Setpoints, Cycling & Heaters
            heading_style: title
            icon: mdi:piggy-bank-outline

          - type: markdown
            text_only: true
            content: |-
              **Safest energy wins:**
              1. **Lower P01 & P04:** Setting DHW to 46–48°C instead of 55°C boosts COP significantly.
              2. **Tune P03 (3–5°C):** Prevents short-cycling without hurting comfort.
              3. **Delay backup heaters (G05–G08):** Set ambient thresholds to `-10..-15°C` and delays to `45–60 min`.
              4. **Tune pump flow (G02/G04):** Aim for 3–5°C Delta T on underfloor heating.

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Heating Setpoint (P01)
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile

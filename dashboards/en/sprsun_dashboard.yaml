# ==============================================================================
# SPRSUN Heat Pump - Complete Dashboard (4 Views, 100% Native Home Assistant)
# ==============================================================================
# Ready-to-use 4-view Sections dashboard (HA 2024.3+ / 2026.x) with zero HACS
# custom cards. Written in plain, beginner-friendly language:
#   1. Default      - everyday controls and simple status summary
#   2. Detailed     - ECO weather curves, water flow, refrigerant circuit & graphs
#   3. Diagnostics  - 24 alarms, heat-exchanger/EEV health, relays & versions
#   4. Optimization - lower power draw + defrost duration & frequency tuning
#
# REQUIREMENTS / RECOMMENDATIONS:
# - Enable "Derived / Calculated Sensors" in the SPRSUN integration Configure dialog.
# - [Expert] sections stay hidden automatically until you enable
#   "Enable Expert Settings" in the integration Configure dialog.
# - If your device name is not "SPRSUN Heat Pump", find-and-replace the
#   "sprsun_heat_pump" prefix across this file with your own prefix.
#
# INSTALLATION:
# Settings -> Dashboards -> + Add Dashboard -> New dashboard from scratch ->
# top-right menu (⋮) -> Raw configuration editor -> Paste all -> Save.
# ==============================================================================

views:
  # ============================================================================
  # VIEW 1: DEFAULT (Daily Control & Simple Summary)
  # ============================================================================
  - type: sections
    title: Default
    path: default
    icon: mdi:home-thermometer
    max_columns: 3
    badges:
      - type: entity
        entity: switch.sprsun_heat_pump_power
        name: Power
      - type: entity
        entity: sensor.sprsun_heat_pump_operating_state
        name: State
      - type: entity
        entity: sensor.sprsun_heat_pump_filtered_ambient_temperature
        name: Outdoor
      - type: entity
        entity: sensor.sprsun_heat_pump_outlet_water_temperature
        name: Flow Temp
      - type: entity
        entity: sensor.sprsun_heat_pump_hot_water_temperature
        name: Hot Water
      - type: entity
        entity: binary_sensor.sprsun_heat_pump_alarm_stop
        name: Alarm
    sections:
      # ------------------------------------------------------------------------
      # Section 1: Conditional Alarm + Live Plain-Language Status
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.sprsun_heat_pump_alarm_stop
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: tile
                  entity: binary_sensor.sprsun_heat_pump_alarm_stop
                  name: "WARNING: Heat Pump Fault Detected!"
                  icon: mdi:alert-octagon
                  color: red
                - type: tile
                  entity: button.sprsun_heat_pump_failure_reset
                  name: "Reset Fault (check Diagnostics tab first)"
                  icon: mdi:restart
                  color: orange

          - type: heading
            heading: What is the heat pump doing?
            heading_style: title
            icon: mdi:heat-pump

          - type: markdown
            text_only: true
            content: |-
              {% set st = states('sensor.sprsun_heat_pump_operating_state') %}
              {% set power = states('switch.sprsun_heat_pump_power') %}
              {% set heat_h = is_state('binary_sensor.sprsun_heat_pump_heating_heater', 'on') %}
              {% set hw_h = is_state('binary_sensor.sprsun_heat_pump_hot_water_heater', 'on') %}
              {% set defrost = is_state('binary_sensor.sprsun_heat_pump_defrost_active', 'on') %}
              {% if power == 'off' %}
              ⚪ **Heat pump is OFF** (standby). Turn on the main power switch below to resume heating or hot water.
              {% elif st == 'alarm' or is_state('binary_sensor.sprsun_heat_pump_alarm_stop', 'on') %}
              🔴 **Stopped due to a fault.** Open the **Diagnostics** tab to inspect the exact alarm, fix the cause, and press Reset.
              {% elif defrost or st == 'defrost' %}
              ❄️ **Defrosting outdoor coil.** For 3–5 minutes the pump reverses heat flow to melt ice outdoors. A brief dip in radiator/floor water temperature is normal.
              {% elif st == 'antilegionella' %}
              🛡️ **Antilegionella disinfection active.** Heating the hot water tank to high temperature to sanitize it.
              {% elif st == 'heating' %}
              🔥 **Space heating active.** Delivering warm water to your home heating loop.
              {% elif st == 'hot_water' %}
              🚿 **Heating domestic hot water (DHW).** Charging the hot water tank.
              {% elif st == 'heating_hot_water' %}
              🔥🚿 **Space heating + Hot water active.**
              {% elif st == 'cooling' or st == 'cooling_hot_water' %}
              🧊 **Cooling active.** Chilling water for your home cooling loop.
              {% elif st == 'idle' %}
              🟢 **Idle — target temperature reached.** Resting until water cools down by the configured hysteresis.
              {% elif is_state('binary_sensor.sprsun_heat_pump_compressor', 'on') %}
              🔥 **Compressor is running** (enable *Derived Sensors* in integration options for a detailed state summary).
              {% else %}
              🟢 **Heat pump is ON (standby).**
              {% endif %}
              {% if heat_h or hw_h %}
              ⚠️ **Notice:** Auxiliary electric backup heater is active (1:1 resistive heat — higher electricity use).
              {% endif %}

          - type: tile
            entity: switch.sprsun_heat_pump_power
            name: Main Power
            icon: mdi:power
            color: green
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_unit_mode
            name: Unit Mode (P06)
            icon: mdi:heat-pump
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_fan_mode
            name: Profile / Noise (P07)
            icon: mdi:fan
            color: teal
            grid_options:
              columns: 12

      # ------------------------------------------------------------------------
      # Section 2: Easy Temperature Controls (+ / -)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Temperature Settings
            heading_style: title
            icon: mdi:thermometer-lines

          - type: markdown
            text_only: true
            content: |-
              Use **[-]** and **[+]** to adjust targets directly. **Hysteresis** sets how many degrees the water must cool down before the compressor restarts (higher = fewer starts).

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Heating Target (P01)
            icon: mdi:radiator
            color: orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_heating_cooling_temp_diff
            name: Heating Hysteresis (P03)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_setpoint
            name: Hot Water Target (P04)
            icon: mdi:water-boiler
            color: red
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_temp_diff
            name: Hot Water Hysteresis (P05)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_cooling_setpoint
            name: Cooling Target (P02)
            icon: mdi:snowflake
            color: cyan
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

      # ------------------------------------------------------------------------
      # Section 3: Key Temperatures & 24h Chart
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Home & Outdoor Temperatures
            heading_style: title
            icon: mdi:home-analytics

          - type: tile
            entity: sensor.sprsun_heat_pump_outlet_water_temperature
            name: Supply Water (Outlet)
            icon: mdi:water-arrow-right
            color: orange
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_inlet_water_temperature
            name: Return Water (Inlet)
            icon: mdi:water-arrow-left
            color: amber
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_hot_water_temperature
            name: Hot Water Tank
            icon: mdi:water-boiler
            color: red
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_ambient_temperature
            name: Outdoor (Raw Sensor)
            icon: mdi:thermometer
            color: blue
            grid_options:
              columns: 6

          - type: thermostat
            entity: climate.sprsun_heat_pump_heating_cooling
            name: Heating / Cooling Thermostat
            show_current_as_primary: true
            grid_options:
              columns: 6

          - type: thermostat
            entity: climate.sprsun_heat_pump_dhw
            name: Hot Water Thermostat
            show_current_as_primary: true
            grid_options:
              columns: 6

          - type: history-graph
            title: Last 24 Hours Temperatures
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.sprsun_heat_pump_outlet_water_temperature
                name: Supply Water
              - entity: sensor.sprsun_heat_pump_inlet_water_temperature
                name: Return Water
              - entity: sensor.sprsun_heat_pump_hot_water_temperature
                name: Hot Water Tank
              - entity: sensor.sprsun_heat_pump_ambient_temperature
                name: Outdoor

  # ============================================================================
  # VIEW 2: DETAILED (Water Loop, ECO Weather Curves, Refrigerant, Electrical)
  # ============================================================================
  - type: sections
    title: Detailed
    path: detailed
    icon: mdi:chart-timeline-variant
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Water Loop & Circulation Pump
            heading_style: title
            icon: mdi:water-pump

          - type: markdown
            text_only: true
            content: |-
              **Water Delta T** is the temperature rise across the heat exchanger (Supply minus Return). Healthy heating values are **3–5°C** (underfloor) or **5–8°C** (radiators). If *Pump Flow* reads `0`, your hardware lacks the optional internal flow meter — watch *Delta T* and *DC Pump Speed* instead.

          - type: tile
            entity: sensor.sprsun_heat_pump_outlet_water_temperature
            name: Supply Water
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_inlet_water_temperature
            name: Return Water
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_water_delta_t
            name: Water Delta T
            icon: mdi:delta
            color: amber
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_pump_speed
            name: DC Pump Speed
            icon: mdi:pump
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_pump_flow
            name: Flow Rate (if fitted)
            icon: mdi:gauge
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_pump_work_mode
            name: Pump Work Mode (G02)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_dc_pump_temp_differential
            name: Target Pump Delta T (G04)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_pump_thermostatic_cycle
            name: Min Restart Delay (G03)
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: ECO Weather Curve (E01–E24)
            heading_style: title
            icon: mdi:chart-bell-curve-cumulative

          - type: markdown
            text_only: true
            content: |-
              Weather compensation automatically lowers supply water temperature on milder days, saving electricity without sacrificing comfort. Below is the curve-calculated target compared to your current supply water.

          - type: tile
            entity: sensor.sprsun_heat_pump_filtered_ambient_temperature
            name: Outdoor Temp (Filtered)
            icon: mdi:weather-partly-cloudy
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eco_curve_target_setpoint
            name: ECO Curve Target
            icon: mdi:target
            color: green
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eco_curve_setpoint_delta
            name: Supply vs ECO Curve
            icon: mdi:compare-horizontal
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Manual Heating Setpoint (P01)
            grid_options:
              columns: 6

          - type: heading
            heading: Space Heating Curve (Outdoor -> Water)
            heading_style: subtitle

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_1
            name: E01 Outdoor 1 (Coldest)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_1
            name: E13 Water @ E01
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_2
            name: E02 Outdoor 2
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_2
            name: E14 Water @ E02
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_3
            name: E03 Outdoor 3
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_3
            name: E15 Water @ E03
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_4
            name: E04 Outdoor 4 (Mildest)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_4
            name: E16 Water @ E04
            grid_options:
              columns: 6

          - type: heading
            heading: Hot Water Curve (E05–E08 -> E17–E20)
            heading_style: subtitle

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_1
            name: E05 Outdoor DHW 1
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_1
            name: E17 DHW @ E05
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_2
            name: E06 Outdoor DHW 2
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_2
            name: E18 DHW @ E06
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_3
            name: E07 Outdoor DHW 3
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_3
            name: E19 DHW @ E07
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_4
            name: E08 Outdoor DHW 4
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_4
            name: E20 DHW @ E08
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Compressor, Fan & Refrigerant Circuit
            heading_style: title
            icon: mdi:sine-wave

          - type: markdown
            text_only: true
            content: |-
              Shows inverter compressor speed (**Hz**), outdoor fan RPM, electronic expansion valves (**EEV**), and refrigerant pressures/temperatures.

          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_frequency
            name: Compressor Frequency
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_target_frequency
            name: Target Frequency
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_fan_1_speed
            name: DC Fan 1 Speed
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_dc_fan_target
            name: DC Fan Target
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_evaporation_temperature
            name: Evaporator Temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_condensation_temperature
            name: Condenser Temp
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_coil_temperature
            name: Outdoor Coil Temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_gas_temperature
            name: Suction Gas Temp
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_exhaust_temperature
            name: Discharge (Exhaust) Temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_driving_temperature
            name: Inverter Drive Temp
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_discharge_pressure
            name: Discharge Pressure
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_pressure
            name: Suction Pressure
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eev1_step
            name: Main EEV1 Position
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_eev2_step
            name: EVI EEV2 Position
            grid_options:
              columns: 6

          - type: heading
            heading: Electrical & Performance
            heading_style: subtitle

          - type: tile
            entity: sensor.sprsun_heat_pump_estimated_electrical_power_experimental
            name: Estimated Power (Exp.)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_current
            name: Compressor Current
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_bus_voltage
            name: DC Bus Voltage
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_runtime
            name: Total Runtime
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_cop
            name: COP (Internal Board)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_heating_cooling_capacity
            name: Capacity (Internal Board)
            grid_options:
              columns: 6

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Antilegionella, Season Changeover & 24h Trends
            heading_style: title
            icon: mdi:calendar-clock

          - type: tile
            entity: switch.sprsun_heat_pump_antilegionella_enable
            name: Antilegionella Enable
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_temperature
            name: Disinfection Temp
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_weekday
            name: Weekday (0=Sun..6=Sat)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_start_hour
            name: Start Hour
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_end_hour
            name: End Hour
            grid_options:
              columns: 6
          - type: tile
            entity: switch.sprsun_heat_pump_two_three_function
            name: Two/Three Function (G01)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_mode_control_enable
            name: Auto Heat/Cool (G09)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_ambient_temp_switch_setpoint
            name: Changeover Temp (G10)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_ambient_temp_switch_diff
            name: Changeover Diff (G11)
            grid_options:
              columns: 6

          - type: history-graph
            title: ECO Curve vs Actual Supply Water & Compressor Hz (24h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.sprsun_heat_pump_outlet_water_temperature
                name: Supply Water
              - entity: number.sprsun_heat_pump_heating_setpoint
                name: Heating Setpoint (P01)
              - entity: sensor.sprsun_heat_pump_eco_curve_target_setpoint
                name: ECO Curve Target
              - entity: sensor.sprsun_heat_pump_compressor_frequency
                name: Compressor (Hz)

  # ============================================================================
  # VIEW 3: DIAGNOSTICS (Health, 24 Alarms, Superheat, Relays & Versions)
  # ============================================================================
  - type: sections
    title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Health & Active Alarms
            heading_style: title
            icon: mdi:shield-check

          - type: markdown
            text_only: true
            content: |-
              {% set errors = [
                'binary_sensor.sprsun_heat_pump_hot_water_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_ambient_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_coil_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_outlet_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_high_pressure_sensor_error',
                'binary_sensor.sprsun_heat_pump_phase_sequence_error',
                'binary_sensor.sprsun_heat_pump_water_flow_error',
                'binary_sensor.sprsun_heat_pump_high_temp_protection_heating_outlet',
                'binary_sensor.sprsun_heat_pump_outlet_gas_temp_error',
                'binary_sensor.sprsun_heat_pump_water_inlet_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_exhaust_temperature_too_high',
                'binary_sensor.sprsun_heat_pump_low_temp_protection_cooling_outlet',
                'binary_sensor.sprsun_heat_pump_inlet_gas_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_low_pressure_protection',
                'binary_sensor.sprsun_heat_pump_high_pressure_protection',
                'binary_sensor.sprsun_heat_pump_coil_temperature_too_high',
                'binary_sensor.sprsun_heat_pump_high_pressure_sensor_failure',
                'binary_sensor.sprsun_heat_pump_low_pressure_sensor_failure',
                'binary_sensor.sprsun_heat_pump_secondary_antifreeze_protection',
                'binary_sensor.sprsun_heat_pump_primary_antifreeze_protection',
                'binary_sensor.sprsun_heat_pump_ambient_temperature_too_low',
                'binary_sensor.sprsun_heat_pump_frequency_conversion_module_fault',
                'binary_sensor.sprsun_heat_pump_dc_fan_2_failure',
                'binary_sensor.sprsun_heat_pump_dc_fan_1_failure'
              ] %}
              {% set active = namespace(items=[]) %}
              {% for e in errors %}
                {% if is_state(e, 'on') %}
                  {% set active.items = active.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endfor %}
              {% if is_state('binary_sensor.sprsun_heat_pump_alarm_stop', 'on') or active.items | length > 0 %}
              🔴 **FAULT DETECTED! Active errors ({{ active.items | length }}):**
              {% for item in active.items %}
              - ⚠️ {{ item }}
              {% endfor %}
              **What to check before resetting:**
              - *Water Flow Error:* clean the Y-strainer, bleed air, check closed radiator valves.
              - *High Pressure:* verify water circulation and heat exchanger cleanliness.
              - *Low Pressure / Antifreeze:* inspect outdoor coil icing and refrigerant charge.
              {% else %}
              🟢 **No active alarms (0 / 24 faults).** All sensors and safety switches are healthy.
              {% endif %}

          - type: tile
            entity: binary_sensor.sprsun_heat_pump_alarm_stop
            name: Master Alarm Stop
            color: red
            grid_options:
              columns: 6

          - type: tile
            entity: button.sprsun_heat_pump_failure_reset
            name: Failure Reset
            icon: mdi:restart
            color: orange
            grid_options:
              columns: 6

          - type: heading
            heading: Heat Exchanger & Refrigerant Health
            heading_style: subtitle


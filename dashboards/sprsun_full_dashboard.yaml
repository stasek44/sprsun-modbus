# ==============================================================================
# SPRSUN Heat Pump - Full Management Dashboard View (100% Native Home Assistant)
# ==============================================================================
# Kompletny widok (zakładka / Dashboard) dla pompy ciepła SPRSUN w Home Assistant.
# Używa wyłącznie wbudowanych kart HA (Tile, Glance, Entities, Grid, Conditional).
#
# INSTRUKCJA DODANIA JAKO NOWEJ ZAKŁADKI:
# 1. W Home Assistant wejdź w swój Pulpit (Dashboard).
# 2. Kliknij "Edytuj pulpit" (Edit Dashboard) w prawym górnym rogu.
# 3. Kliknij ikonę "+" obok istniejących zakładek, aby dodać nowy widok.
# 4. W oknie konfiguracji widoku kliknij trzy kropki (⋮) -> "Edytor konfiguracji RAW"
#    lub przełącz edytor widoku w tryb YAML i wklej poniższą zawartość.
# 5. Pamiętaj, aby w razie potrzeby zamienić "heat_pump" na własny prefiks encji!
# ==============================================================================

title: Pompa Ciepła
path: pompa-ciepla
icon: mdi:heat-pump
badges:
  - entity: switch.heat_pump_power
  - entity: sensor.heat_pump_cop
  - entity: sensor.heat_pump_ambient_temperature
  - entity: sensor.heat_pump_outlet_water_temperature
  - entity: binary_sensor.heat_pump_alarm_stop

cards:
  # ============================================================================
  # SEKCJA 1: AWARIA (Ukryte, gdy brak alarmów)
  # ============================================================================
  - type: conditional
    conditions:
      - entity: binary_sensor.heat_pump_alarm_stop
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: tile
          entity: binary_sensor.heat_pump_alarm_stop
          name: "WYKRYTO BŁĄD LUB ALARM POMPY!"
          icon: mdi:alert-octagon
          color: red
        - type: tile
          entity: button.heat_pump_failure_reset
          name: "Zresetuj błędy (Failure Reset)"
          icon: mdi:restart
          color: orange

  # ============================================================================
  # SEKCJA 2: STEROWANIE SZYBKIE (ZASILANIE, TRYB, CO, CWU)
  # ============================================================================
  - type: vertical-stack
    title: ⚡ Sterowanie i Nastawy Temperatur
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.heat_pump_power
            name: Zasilanie Pompy
            icon: mdi:power
            color: green
          - type: tile
            entity: select.heat_pump_unit_mode
            name: Tryb Jednostki (P06)
            icon: mdi:heat-pump

      # Ogrzewanie CO
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: number.heat_pump_heating_setpoint
            name: Zadana CO (P01)
            icon: mdi:radiator
            color: orange
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.heat_pump_heating_cooling_temp_diff
            name: Histereza CO (P03)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            features:
              - type: numeric-input
                style: buttons

      # Ciepła Woda CWU
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: number.heat_pump_hot_water_setpoint
            name: Zadana CWU (P04)
            icon: mdi:water-boiler
            color: red
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.heat_pump_hot_water_temp_diff
            name: Histereza CWU (P05)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            features:
              - type: numeric-input
                style: buttons

      # Chłodzenie
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: number.heat_pump_cooling_setpoint
            name: Zadana Chłodzenie (P02)
            icon: mdi:snowflake
            color: cyan
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: select.heat_pump_fan_mode
            name: Tryb Wentylatora (P07)
            icon: mdi:fan
            color: teal

  # ============================================================================
  # SEKCJA 3: MONITORING TEMPERATUR I PRACY UKŁADU
  # ============================================================================
  - type: vertical-stack
    title: 🌡️ Temperatury i Przepływ
    cards:
      - type: glance
        show_name: true
        show_state: true
        entities:
          - entity: sensor.heat_pump_inlet_water_temperature
            name: Powrót CO
            icon: mdi:water-arrow-left
          - entity: sensor.heat_pump_outlet_water_temperature
            name: Zasilanie CO
            icon: mdi:water-arrow-right
          - entity: sensor.heat_pump_hot_water_temperature
            name: Zbiornik CWU
            icon: mdi:water-boiler
          - entity: sensor.heat_pump_ambient_temperature
            name: Na zewnątrz
            icon: mdi:thermometer
          - entity: sensor.heat_pump_pump_flow
            name: Przepływ
            icon: mdi:gauge

      - type: glance
        title: Czujniki wewnątrz pompy
        show_name: true
        show_state: true
        entities:
          - entity: sensor.heat_pump_evaporation_temperature
            name: Parownik
          - entity: sensor.heat_pump_condensation_temperature
            name: Skraplacz
          - entity: sensor.heat_pump_suction_gas_temperature
            name: Gaz ssawny
          - entity: sensor.heat_pump_exhaust_temperature
            name: Tłoczenie
          - entity: sensor.heat_pump_coil_temperature
            name: Lamele/Cewka

  # ============================================================================
  # SEKCJA 4: ENERGIA, MOC I EFEKTYWNOŚĆ (COP)
  # ============================================================================
  - type: vertical-stack
    title: ⚡ Parametry Elektryczne i Wydajność
    cards:
      - type: glance
        show_name: true
        show_state: true
        entities:
          - entity: sensor.heat_pump_cop
            name: COP
            icon: mdi:leaf
          - entity: sensor.heat_pump_heating_cooling_capacity
            name: Moc grzewcza
            icon: mdi:fire
          - entity: sensor.heat_pump_compressor_frequency
            name: Sprężarka
            icon: mdi:sine-wave
          - entity: sensor.heat_pump_compressor_runtime
            name: Czas pracy
            icon: mdi:clock-outline

      - type: glance
        title: Pomiary elektryczne
        show_name: true
        show_state: true
        entities:
          - entity: sensor.heat_pump_ac_voltage
            name: Napięcie AC
            icon: mdi:flash
          - entity: sensor.heat_pump_ac_current
            name: Prąd AC
            icon: mdi:current-ac
          - entity: sensor.heat_pump_compressor_current
            name: Prąd sprężarki
            icon: mdi:speedometer

  # ============================================================================
  # SEKCJA 5: STATUSY I PRZEKAŹNIKI
  # ============================================================================
  - type: vertical-stack
    title: ⚙️ Stan Podzespołów i Zapotrzebowanie
    cards:
      - type: entities
        title: Wyjścia i Przekaźniki
        show_header_toggle: false
        entities:
          - entity: binary_sensor.heat_pump_compressor
            name: Sprężarka
            icon: mdi:engine
          - entity: binary_sensor.heat_pump_fan
            name: Wentylator
            icon: mdi:fan
          - entity: binary_sensor.heat_pump_circulation_pump
            name: Pompa obiegowa
            icon: mdi:pump
          - entity: binary_sensor.heat_pump_3_way_valve
            name: Zawór 3-drożny (CWU/CO)
            icon: mdi:valve
          - entity: binary_sensor.heat_pump_4_way_valve
            name: Zawór 4-drożny
            icon: mdi:valve
          - entity: binary_sensor.heat_pump_defrost_active
            name: Tryb odszraniania (Defrost)
            icon: mdi:snowflake-melt

      - type: entities
        title: Zapotrzebowanie i Tryby
        show_header_toggle: false
        entities:
          - entity: binary_sensor.heat_pump_heating_demand
            name: Zapotrzebowanie na grzanie (CO)
          - entity: binary_sensor.heat_pump_hot_water_demand
            name: Zapotrzebowanie na CWU
          - entity: binary_sensor.heat_pump_cooling_demand
            name: Zapotrzebowanie na chłodzenie
          - entity: binary_sensor.heat_pump_antilegionella_active
            name: Cykl antylegionella aktywny

  # ============================================================================
  # SEKCJA 6: ANTYLEGIONELLA I USTAWIENIA ZAAWANSOWANE
  # ============================================================================
  - type: vertical-stack
    title: 🛡️ Ochrona Antylegionella i Opcje
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.heat_pump_antilegionella_enable
            name: Ochrona przed Legionellą (Włącz/Wyłącz)
          - entity: number.heat_pump_temp_antilegionella
            name: Temperatura dezynfekcji
          - entity: number.heat_pump_antilegionella_weekday
            name: Dzień tygodnia (0=Ndz, 6=Sob)
          - entity: number.heat_pump_antilegionella_start_hour
            name: Godzina rozpoczęcia
          - entity: number.heat_pump_antilegionella_end_hour
            name: Godzina zakończenia
          - entity: select.heat_pump_pump_work_mode
            name: Tryb pracy pompy obiegowej (G02)
          - entity: switch.heat_pump_two_three_function
            name: Tryb 2/3 funkcyjny

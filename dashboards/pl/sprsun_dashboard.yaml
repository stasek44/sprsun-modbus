              - entity: binary_sensor.sprsun_heat_pump_high_pressure_protection
                name: Zabezpieczenie wysokiego ciśnienia
              - entity: binary_sensor.sprsun_heat_pump_low_pressure_protection
                name: Zabezpieczenie niskiego ciśnienia
              - entity: binary_sensor.sprsun_heat_pump_exhaust_temperature_too_high
                name: Za wysoka temp. tłoczenia
              - entity: binary_sensor.sprsun_heat_pump_high_temp_protection_heating_outlet
                name: Za wysoka temp. wody CO
              - entity: binary_sensor.sprsun_heat_pump_low_temp_protection_cooling_outlet

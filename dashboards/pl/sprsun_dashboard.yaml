              - entity: sensor.sprsun_heat_pump_display_version
                name: Wersja panelu sterowania
              - entity: sensor.sprsun_heat_pump_software_version_year
                name: Data firmware (Rok hex)
              - entity: sensor.sprsun_heat_pump_software_version_month_day
                name: Data firmware (Miesiąc/Dzień hex)

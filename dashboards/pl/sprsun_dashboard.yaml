# ==============================================================================
# SPRSUN Heat Pump - Pełny Dashboard (4 Zakładki, 100% Natywny Home Assistant)
# ==============================================================================
# Gotowy, 4-widokowy pulpit w układzie Sekcji (HA 2024.3+ / 2026.x) bez żadnych
# dodatkowych kart z HACS. Zbudowany prostym językiem dla każdego domownika:
#   1. Domyślny       - codzienne sterowanie i podgląd prostym językiem
#   2. Szczegółowy    - krzywa pogodowa ECO, przepływ, obieg chłodniczy i wykresy
#   3. Diagnostyczny  - 24 alarmy, kondycja wymiennika/EEV, przekaźniki i wersje
#   4. Optymalizacyjny- jak obniżyć rachunki + optymalizacja czasu i częstotliwości defrostu
#
# WYMAGANIA / ZALECENIA:
# - Zalecane włączenie opcji "Sensory wyliczane" (Configure integracji SPRSUN).
# - Sekcje [Ekspert] ukrywają się automatycznie, dopóki nie włączysz opcji
#   "Ustawienia eksperckie" w konfiguracji integracji.
# - Jeśli nazwa Twojego urządzenia to nie "SPRSUN Heat Pump", zamień w całym
#   pliku (Ctrl+H) prefiks "sprsun_heat_pump" na własny (np. "pompa_ciepla").
#
# INSTALACJA:
# Ustawienia -> Pulpity -> + Dodaj pulpit -> Nowy pulpit od zera -> (⋮) w prawym
# górnym rogu -> Edytor konfiguracji RAW -> Wklej całość -> Zapisz.
# ==============================================================================

views:
  # ============================================================================
  # ZAKŁADKA 1: DOMYŚLNY (Codzienna obsługa i podgląd dla laika)
  # ============================================================================
  - type: sections
    title: Domyślny
    path: domyslny
    icon: mdi:home-thermometer
    max_columns: 3
    badges:
      - type: entity
        entity: switch.sprsun_heat_pump_power
        name: Zasilanie
      - type: entity
        entity: sensor.sprsun_heat_pump_operating_state
        name: Stan pracy
      - type: entity
        entity: sensor.sprsun_heat_pump_filtered_ambient_temperature
        name: Na zewnątrz
      - type: entity
        entity: sensor.sprsun_heat_pump_outlet_water_temperature
        name: Woda CO
      - type: entity
        entity: sensor.sprsun_heat_pump_hot_water_temperature
        name: Ciepła woda
      - type: entity
        entity: binary_sensor.sprsun_heat_pump_alarm_stop
        name: Alarm
    sections:
      # ------------------------------------------------------------------------
      # Sekcja 1: Alert awarii (widoczny tylko w razie błędu) + Stan na żywo
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.sprsun_heat_pump_alarm_stop
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: tile
                  entity: binary_sensor.sprsun_heat_pump_alarm_stop
                  name: "UWAGA: Wykryto błąd pracy pompy!"
                  icon: mdi:alert-octagon
                  color: red
                - type: tile
                  entity: button.sprsun_heat_pump_failure_reset
                  name: "Zresetuj błąd (sprawdź najpierw zakładkę Diagnostyka)"
                  icon: mdi:restart
                  color: orange

          - type: heading
            heading: Co teraz robi pompa?
            heading_style: title
            icon: mdi:heat-pump

          - type: markdown
            text_only: true
            content: |-
              {% set st = states('sensor.sprsun_heat_pump_operating_state') %}
              {% set power = states('switch.sprsun_heat_pump_power') %}
              {% set heat_h = is_state('binary_sensor.sprsun_heat_pump_heating_heater', 'on') %}
              {% set hw_h = is_state('binary_sensor.sprsun_heat_pump_hot_water_heater', 'on') %}
              {% set defrost = is_state('binary_sensor.sprsun_heat_pump_defrost_active', 'on') %}
              {% if power == 'off' %}
              ⚪ **Pompa jest wyłączona** (tryb gotowości). Aby uruchomić ogrzewanie lub CWU, włącz zasilanie poniżej.
              {% elif st == 'alarm' or is_state('binary_sensor.sprsun_heat_pump_alarm_stop', 'on') %}
              🔴 **Pompa zatrzymała się z powodu błędu.** Zajrzyj do zakładki **Diagnostyka**, usuń przyczynę (np. brak przepływu wody) i kliknij Reset.
              {% elif defrost or st == 'defrost' %}
              ❄️ **Trwa odszranianie (Defrost).** Pompa na 3–5 minut odwraca obieg, żeby roztopić lód z jednostki na zewnątrz. Chwilowy spadek temperatury wody w domu jest normalny.
              {% elif st == 'antilegionella' %}
              🛡️ **Trwa dezynfekcja zbiornika (Antylegionella).** Pompa wygrzewa ciepłą wodę do wysokiej temperatury, aby usunąć bakterie.
              {% elif st == 'heating' %}
              🔥 **Ogrzewanie domu (CO).** Pompa dostarcza ciepło do instalacji grzewczej.
              {% elif st == 'hot_water' %}
              🚿 **Podgrzewanie ciepłej wody (CWU).** Pompa ładuje zasobnik wody użytkowej.
              {% elif st == 'heating_hot_water' %}
              🔥🚿 **Grzanie domu i ciepłej wody.** Jednoczesne zapotrzebowanie na CO i CWU.
              {% elif st == 'cooling' or st == 'cooling_hot_water' %}
              🧊 **Chłodzenie budynku.** Pompa obniża temperaturę wody w instalacji.
              {% elif st == 'idle' %}
              🟢 **Czuwanie — w domu jest już wystarczająco ciepło.** Pompa osiągnęła zadaną temperaturę i odpoczywa, czekając aż woda ostygnie o ustawioną histerezę.
              {% elif is_state('binary_sensor.sprsun_heat_pump_compressor', 'on') %}
              🔥 **Sprężarka pracuje** (włącz opcję *Sensory wyliczane* w integracji, aby widzieć dokładny opis stanu).
              {% else %}
              🟢 **Pompa włączona (czuwanie).**
              {% endif %}
              {% if heat_h or hw_h %}
              ⚠️ **Uwaga:** Działa wspomagająca grzałka elektryczna (droższe grzanie 1:1).
              {% endif %}

          - type: tile
            entity: switch.sprsun_heat_pump_power
            name: Włącznik główny
            icon: mdi:power
            color: green
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_unit_mode
            name: Tryb pracy (P06)
            icon: mdi:heat-pump
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_fan_mode
            name: Styl pracy / hałas (P07)
            icon: mdi:fan
            color: teal
            grid_options:
              columns: 12

      # ------------------------------------------------------------------------
      # Sekcja 2: Wygodne ustawianie temperatur (+ / -)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Ustawienia temperatur
            heading_style: title
            icon: mdi:thermometer-lines

          - type: markdown
            text_only: true
            content: |-
              Przyciski **[-]** i **[+]** zmieniają temperaturę docelową. **Histereza** oznacza, o ile stopni woda musi ostygnąć, zanim pompa ponownie się włączy (większa = rzadsze włączanie sprężarki).

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Zadana ogrzewania CO (P01)
            icon: mdi:radiator
            color: orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_heating_cooling_temp_diff
            name: Histereza CO (P03)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_setpoint
            name: Zadana ciepłej wody CWU (P04)
            icon: mdi:water-boiler
            color: red
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_temp_diff
            name: Histereza CWU (P05)
            icon: mdi:arrow-expand-vertical
            color: deep-orange
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_cooling_setpoint
            name: Zadana chłodzenia (P02)
            icon: mdi:snowflake
            color: cyan
            grid_options:
              columns: 12
            features:
              - type: numeric-input
                style: buttons

      # ------------------------------------------------------------------------
      # Sekcja 3: Kluczowe temperatury + Wykres 24h
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Temperatury w domu i na zewnątrz
            heading_style: title
            icon: mdi:home-analytics

          - type: tile
            entity: sensor.sprsun_heat_pump_outlet_water_temperature
            name: Woda do domu (Zasilanie)
            icon: mdi:water-arrow-right
            color: orange
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_inlet_water_temperature
            name: Woda z domu (Powrót)
            icon: mdi:water-arrow-left
            color: amber
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_hot_water_temperature
            name: Zbiornik CWU
            icon: mdi:water-boiler
            color: red
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_ambient_temperature
            name: Na zewnątrz (czujnik)
            icon: mdi:thermometer
            color: blue
            grid_options:
              columns: 6

          - type: thermostat
            entity: climate.sprsun_heat_pump_heating_cooling
            name: Termostat CO / Chłodzenie
            show_current_as_primary: true
            grid_options:
              columns: 6

          - type: thermostat
            entity: climate.sprsun_heat_pump_dhw
            name: Termostat CWU
            show_current_as_primary: true
            grid_options:
              columns: 6

          - type: history-graph
            title: Temperatury z ostatnich 24 godzin
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.sprsun_heat_pump_outlet_water_temperature
                name: Zasilanie CO
              - entity: sensor.sprsun_heat_pump_inlet_water_temperature
                name: Powrót CO
              - entity: sensor.sprsun_heat_pump_hot_water_temperature
                name: Zbiornik CWU
              - entity: sensor.sprsun_heat_pump_ambient_temperature
                name: Na zewnątrz

  # ============================================================================
  # ZAKŁADKA 2: SZCZEGÓŁOWY (Obieg wody, krzywe ECO, chłodnictwo, elektryka)
  # ============================================================================
  - type: sections
    title: Szczegółowy
    path: szczegolowy
    icon: mdi:chart-timeline-variant
    max_columns: 3
    sections:
      # ------------------------------------------------------------------------
      # Sekcja 1: Obieg wody, przepływ i pompa obiegowa
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Obieg wody i pompa obiegowa
            heading_style: title
            icon: mdi:water-pump

          - type: markdown
            text_only: true
            content: |-
              **Delta T wody** to różnica między wodą wychodzącą a wracającą do pompy. Zdrowa wartość podczas grzania to **3–5°C** (podłogówka) lub **5–8°C** (grzejniki). Jeśli *Przepływ* pokazuje `0`, Twój model nie ma fabrycznego przepływomierza — obserwuj *Deltę T* i *Prędkość pompy DC*.

          - type: tile
            entity: sensor.sprsun_heat_pump_outlet_water_temperature
            name: Zasilanie CO
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_inlet_water_temperature
            name: Powrót CO
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_water_delta_t
            name: Delta T wody (Zasilanie - Powrót)
            icon: mdi:delta
            color: amber
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_pump_speed
            name: Prędkość pompy DC
            icon: mdi:pump
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_pump_flow
            name: Przepływ (jeśli wspierany)
            icon: mdi:gauge
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_pump_work_mode
            name: Tryb pompy obiegowej (G02)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_dc_pump_temp_differential
            name: Docelowa Delta T pompy (G04)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_pump_thermostatic_cycle
            name: Minimalny postój sprężarki (G03)
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 2: Krzywa pogodowa ECO (E01-E24)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Krzywa pogodowa ECO (E01–E24)
            heading_style: title
            icon: mdi:chart-bell-curve-cumulative

          - type: markdown
            text_only: true
            content: |-
              Krzywa ECO automatycznie dobiera temperaturę wody do pogody: im cieplej na dworze, tym chłodniejsza woda idzie w instalację (duża oszczędność prądu!). Poniżej widać cel wyliczony z krzywej vs rzeczywista temperatura wody.

          - type: tile
            entity: sensor.sprsun_heat_pump_filtered_ambient_temperature
            name: Temp. zewn. (odfiltrowana)
            icon: mdi:weather-partly-cloudy
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eco_curve_target_setpoint
            name: Cel z krzywej ECO
            icon: mdi:target
            color: green
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eco_curve_setpoint_delta
            name: Różnica Woda vs Krzywa ECO
            icon: mdi:compare-horizontal
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Ręczna zadana CO (P01)
            grid_options:
              columns: 6

          - type: heading
            heading: Punkty krzywej grzania CO (Temp. zewn. -> Temp. wody)
            heading_style: subtitle

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_1
            name: E01 Zewn. 1 (Mróz)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_1
            name: E13 Woda dla E01
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_2
            name: E02 Zewn. 2
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_2
            name: E14 Woda dla E02
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_3
            name: E03 Zewn. 3
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_3
            name: E15 Woda dla E03
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_ambient_4
            name: E04 Zewn. 4 (Ciepło)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_heat_temp_4
            name: E16 Woda dla E04
            grid_options:
              columns: 6

          - type: heading
            heading: Punkty krzywej CWU (E05–E08 -> E17–E20)
            heading_style: subtitle

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_1
            name: E05 Zewn. CWU 1
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_1
            name: E17 CWU dla E05
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_2
            name: E06 Zewn. CWU 2
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_2
            name: E18 CWU dla E06
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_3
            name: E07 Zewn. CWU 3
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_3
            name: E19 CWU dla E07
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_economic_water_ambient_4
            name: E08 Zewn. CWU 4
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_economic_water_temp_4
            name: E20 CWU dla E08
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 3: Obieg chłodniczy, sprężarka i elektryka
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Sprężarka, wentylator i obieg chłodniczy
            heading_style: title
            icon: mdi:sine-wave

          - type: markdown
            text_only: true
            content: |-
              Pokazuje z jaką prędkością kręci się sprężarka (**Hz**) i wentylator (**rpm**) oraz jakie temperatury panują wewnątrz czynnika chłodniczego.

          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_frequency
            name: Częstotliwość sprężarki
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_target_frequency
            name: Częstotliwość docelowa
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_fan_1_speed
            name: Wentylator 1
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_dc_fan_target
            name: Wentylator (cel)
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_evaporation_temperature
            name: Parownik
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_condensation_temperature
            name: Skraplacz
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_coil_temperature
            name: Lamele / Cewka zewn.
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_gas_temperature
            name: Gaz ssawny
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_exhaust_temperature
            name: Tłoczenie (wylot sprężarki)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_driving_temperature
            name: Temp. modułu falownika
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_discharge_pressure
            name: Ciśnienie wysokie (tłoczenie)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_pressure
            name: Ciśnienie niskie (ssanie)
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eev1_step
            name: Zawór główny EEV1
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_eev2_step
            name: Zawór EVI (EEV2)
            grid_options:
              columns: 6

          - type: heading
            heading: Elektryka, wydajność i automatyka
            heading_style: subtitle

          - type: tile
            entity: sensor.sprsun_heat_pump_estimated_electrical_power_experimental
            name: Szacowana moc (eksp.)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_current
            name: Prąd sprężarki
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_dc_bus_voltage
            name: Napięcie szyny DC
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_runtime
            name: Łączny czas pracy
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_cop
            name: COP (z płyty pompy)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_heating_cooling_capacity
            name: Moc cieplna (z płyty)
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 4 (szeroka): Antylegionella, Grzałki, Lato/Zima i Wykresy
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Ochrona Antylegionella, Grzałki i Przełączanie Lato/Zima
            heading_style: title
            icon: mdi:calendar-clock

          - type: tile
            entity: switch.sprsun_heat_pump_antilegionella_enable
            name: Antylegionella (Wł./Wył.)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_temperature
            name: Temp. dezynfekcji
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_weekday
            name: Dzień (0=Ndz..6=Sob)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_start_hour
            name: Godzina startu
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_antilegionella_end_hour
            name: Godzina końca
            grid_options:
              columns: 6
          - type: tile
            entity: switch.sprsun_heat_pump_two_three_function
            name: Tryb 2/3-funkcyjny (G01)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_mode_control_enable
            name: Auto Lato/Zima (G09)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_ambient_temp_switch_setpoint
            name: Próg przełączania (G10)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_ambient_temp_switch_diff
            name: Histereza przeł. (G11)
            grid_options:
              columns: 6

          - type: history-graph
            title: Krzywa ECO vs Rzeczywiste zasilanie i Praca sprężarki (24h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.sprsun_heat_pump_outlet_water_temperature
                name: Zasilanie CO
              - entity: number.sprsun_heat_pump_heating_setpoint
                name: Zadana CO (P01)
              - entity: sensor.sprsun_heat_pump_eco_curve_target_setpoint
                name: Cel z krzywej ECO
              - entity: sensor.sprsun_heat_pump_compressor_frequency
                name: Sprężarka (Hz)

  # ============================================================================
  # ZAKŁADKA 3: DIAGNOSTYCZNY (Alarmy, zdrowie układu, przekaźniki i serwis)
  # ============================================================================
  - type: sections
    title: Diagnostyczny
    path: diagnostyczny
    icon: mdi:stethoscope
    max_columns: 3
    sections:
      # ------------------------------------------------------------------------
      # Sekcja 1: Centrum Alarmów i Aktywnych Błędów
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Stan zdrowia i Alarmy
            heading_style: title
            icon: mdi:shield-check

          - type: markdown
            text_only: true
            content: |-
              {% set errors = [
                'binary_sensor.sprsun_heat_pump_hot_water_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_ambient_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_coil_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_outlet_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_high_pressure_sensor_error',
                'binary_sensor.sprsun_heat_pump_phase_sequence_error',
                'binary_sensor.sprsun_heat_pump_water_flow_error',
                'binary_sensor.sprsun_heat_pump_high_temp_protection_heating_outlet',
                'binary_sensor.sprsun_heat_pump_outlet_gas_temp_error',
                'binary_sensor.sprsun_heat_pump_water_inlet_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_exhaust_temperature_too_high',
                'binary_sensor.sprsun_heat_pump_low_temp_protection_cooling_outlet',
                'binary_sensor.sprsun_heat_pump_inlet_gas_temp_sensor_error',
                'binary_sensor.sprsun_heat_pump_low_pressure_protection',
                'binary_sensor.sprsun_heat_pump_high_pressure_protection',
                'binary_sensor.sprsun_heat_pump_coil_temperature_too_high',
                'binary_sensor.sprsun_heat_pump_high_pressure_sensor_failure',
                'binary_sensor.sprsun_heat_pump_low_pressure_sensor_failure',
                'binary_sensor.sprsun_heat_pump_secondary_antifreeze_protection',
                'binary_sensor.sprsun_heat_pump_primary_antifreeze_protection',
                'binary_sensor.sprsun_heat_pump_ambient_temperature_too_low',
                'binary_sensor.sprsun_heat_pump_frequency_conversion_module_fault',
                'binary_sensor.sprsun_heat_pump_dc_fan_2_failure',
                'binary_sensor.sprsun_heat_pump_dc_fan_1_failure'
              ] %}
              {% set active = namespace(items=[]) %}
              {% for e in errors %}
                {% if is_state(e, 'on') %}
                  {% set active.items = active.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endfor %}
              {% if is_state('binary_sensor.sprsun_heat_pump_alarm_stop', 'on') or active.items | length > 0 %}
              🔴 **WYKRYTO AWARIĘ! Aktywne błędy ({{ active.items | length }}):**
              {% for item in active.items %}
              - ⚠️ {{ item }}
              {% endfor %}
              **Co sprawdzić przed resetem?**
              - *Błąd przepływu (Water Flow):* wyczyść filtr siatkowy, sprawdź odpowietrzenie i czy głowice/zawory nie są pozamykane.
              - *Wysokie ciśnienie:* sprawdź obieg wody i czystość wymiennika.
              - *Niskie ciśnienie / Zamarzanie:* sprawdź czy parownik nie jest oblodzony i ciśnienie czynnika.
              {% else %}
              🟢 **Brak aktywnych alarmów (0 / 24 błędów).** Wszystkie czujniki i zabezpieczenia pracują prawidłowo.
              {% endif %}

          - type: tile
            entity: binary_sensor.sprsun_heat_pump_alarm_stop
            name: Alarm główny (Stop)
            color: red
            grid_options:
              columns: 6

          - type: tile
            entity: button.sprsun_heat_pump_failure_reset
            name: Reset błędów
            icon: mdi:restart
            color: orange
            grid_options:
              columns: 6

          - type: heading
            heading: Zdrowie obiegu chłodniczego i wymiennika
            heading_style: subtitle

          - type: markdown
            text_only: true
            content: |-
              **Jak czytać te liczby (dla laika)?**
              - **Approach skraplacza:** różnica między czynnikiem a wodą. Norma: **1–4°C**. Powyżej **6°C** przy pracy = słaby przepływ lub zabrudzony wymiennik.
              - **Przegrzanie ssania:** ile czynnik odparował przed sprężarką. Norma: **2–7°C**. Blisko **0°C** lub ujemne = ryzyko zalania sprężarki; **> 10°C** = możliwy ubytek czynnika lub problem z EEV.
              - **Tłoczenie sprężarki:** bezpiecznie **< 95°C** (powyżej **105°C** pompa wyłączy się awaryjnie).

          - type: tile
            entity: sensor.sprsun_heat_pump_condenser_approach_temperature
            name: Approach skraplacza
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_superheat
            name: Przegrzanie ssania
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_discharge_superheat
            name: Przegrzanie tłoczenia
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_exhaust_temperature
            name: Temp. tłoczenia (norma <95°C)
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_discharge_pressure
            name: Ciśnienie wysokie
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_suction_pressure
            name: Ciśnienie niskie
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 2: Wyjścia przekaźnikowe i Wejścia cyfrowe
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Co aktualnie jest włączone? (Przekaźniki i Wejścia)
            heading_style: title
            icon: mdi:electric-switch

          - type: markdown
            text_only: true
            content: |-
              Tutaj widzisz dokładnie, które podzespoły fizycznie pracują. **Zawór 3-drogowy** `ON` kieruje wodę do zasobnika CWU, a `OFF` na ogrzewanie domu. **Zawór 4-drogowy** `ON` oznacza chłodzenie lub defrost.

          - type: entities
            title: Wyjścia wykonawcze (Przekaźniki)
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sprsun_heat_pump_compressor
                name: Sprężarka
              - entity: binary_sensor.sprsun_heat_pump_circulation_pump
                name: Pompa obiegowa główna
              - entity: binary_sensor.sprsun_heat_pump_fan
                name: Wentylator zewnętrzny
              - entity: binary_sensor.sprsun_heat_pump_fan_high_speed
                name: Wentylator (wysoki bieg)
              - entity: binary_sensor.sprsun_heat_pump_3_way_valve
                name: Zawór 3-drożny (ON = CWU / OFF = CO)
              - entity: binary_sensor.sprsun_heat_pump_4_way_valve
                name: Zawór 4-drożny (ON = Chłodz./Defrost)
              - entity: binary_sensor.sprsun_heat_pump_heating_heater
                name: Grzałka elektryczna CO (OUT4)
              - entity: binary_sensor.sprsun_heat_pump_hot_water_heater
                name: Grzałka elektryczna CWU (OUT12)
              - entity: binary_sensor.sprsun_heat_pump_chassis_heater
                name: Grzałka tacy ociekowej (~43W)
              - entity: binary_sensor.sprsun_heat_pump_crank_heater
                name: Grzałka karteru sprężarki
              - entity: binary_sensor.sprsun_heat_pump_assistant_solenoid_valve
                name: Zawór wtrysku EVI
              - entity: binary_sensor.sprsun_heat_pump_a_c_pump
                name: Pompa pomocnicza A/C

          - type: entities
            title: Zapotrzebowanie i Wejścia sterujące
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sprsun_heat_pump_heating_demand
                name: Zapotrzebowanie na grzanie CO
              - entity: binary_sensor.sprsun_heat_pump_hot_water_demand
                name: Zapotrzebowanie na CWU
              - entity: binary_sensor.sprsun_heat_pump_cooling_demand
                name: Zapotrzebowanie na chłodzenie
              - entity: binary_sensor.sprsun_heat_pump_defrost_active
                name: Odszranianie (Defrost) aktywne
              - entity: binary_sensor.sprsun_heat_pump_antilegionella_active
                name: Antylegionella aktywna
              - entity: binary_sensor.sprsun_heat_pump_flow_switch
                name: Czujnik przepływu (styk)
              - entity: binary_sensor.sprsun_heat_pump_high_pressure_switch
                name: Presostat wysokiego ciśnienia
              - entity: binary_sensor.sprsun_heat_pump_phase_sequence_ok
                name: Kontrola kolejności faz
              - entity: binary_sensor.sprsun_heat_pump_linkage_switch
                name: Zewnętrzny termostat (Linkage)

      # ------------------------------------------------------------------------
      # Sekcja 3: Wszystkie kody błędów i wersje sprzętowe
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Rejestr błędów (24) i Wersje
            heading_style: title
            icon: mdi:alert-circle-outline

          - type: entities
            title: Błędy przepływu, ciśnień i zabezpieczeń
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sprsun_heat_pump_water_flow_error

  # ============================================================================
  # ZAKŁADKA 4: OPTYMALIZACYJNY (Niższe rachunki + Czas i Częstotliwość Defrostu)
  # ============================================================================
  - type: sections
    title: Optymalizacyjny
    path: optymalizacyjny
    icon: mdi:tune-variant
    max_columns: 3
    sections:
      # ------------------------------------------------------------------------
      # Sekcja 1: Asystent Optymalizacji na żywo + Metryki energii
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Asystent oszczędzania energii i defrostu
            heading_style: title
            icon: mdi:lightbulb-on-outline

          - type: markdown
            text_only: true
            content: |-
              {% set cycle = states('sensor.sprsun_heat_pump_compressor_last_run_duration') %}
              {% set def_dur = states('sensor.sprsun_heat_pump_last_defrost_duration') %}
              {% set def_int = states('sensor.sprsun_heat_pump_defrost_interval') %}
              {% set coil_d = states('sensor.sprsun_heat_pump_coil_ambient_temperature_delta') %}
              {% set water_d = states('sensor.sprsun_heat_pump_water_delta_t') %}
              {% set eco_d = states('sensor.sprsun_heat_pump_eco_curve_setpoint_delta') %}
              {% set op = states('sensor.sprsun_heat_pump_operating_state') %}
              {% set defrost = is_state('binary_sensor.sprsun_heat_pump_defrost_active', 'on') or op == 'defrost' %}
              {% set heating_run = op in ['heating', 'hot_water', 'heating_hot_water'] %}
              {% set hz = states('sensor.sprsun_heat_pump_compressor_frequency') | float(0) %}
              {% set heat_h = is_state('binary_sensor.sprsun_heat_pump_heating_heater', 'on') %}
              {% set hw_h = is_state('binary_sensor.sprsun_heat_pump_hot_water_heater', 'on') %}
              {% set ch_h = is_state('binary_sensor.sprsun_heat_pump_chassis_heater', 'on') %}
              **Szybka ocena na podstawie bieżących odczytów:**
              {% if is_number(cycle) and cycle | float > 0 %}
              {% if cycle | float < 15 %}
              - 🟡 **Krótki cykl sprężarki ({{ cycle }} min):** Jeśli to nie koniec ładowania CWU, pompa może taktować. Zwiększ *Histerezę CO (P03)* o 1°C lub wydłuż *Postój (G03)*.
              {% else %}
              - 🟢 **Długość cyklu sprężarki ({{ cycle }} min):** Stabilna, długa praca (mało strat rozruchowych).
              {% endif %}
              {% endif %}
              {% if defrost %}
              - ❄️ **Trwa odszranianie (defrost):** Pompa odwróciła obieg i pobiera chwilowo ciepło z wody (`Delta T wody` ujemna — to normalne). Ocena przepływu wróci po zakończeniu defrostu.
              {% elif is_number(water_d) and hz > 0 and heating_run %}
              {% if water_d | float < 0 %}
              - 🔄 **Stabilizacja po defroście / rozruchu (Delta T {{ water_d }} °C):** Chłodniejsza woda wraca jeszcze przez wymiennik po starcie lub odszranianiu.
              {% elif water_d | float < 2.0 %}
              - 🟡 **Mała Delta T wody ({{ water_d }} °C):** Pompa obiegowa kręci wodą bardzo szybko lub woda słabo odbiera ciepło. Sprawdź *G04 (Docelowa Delta T)* i prędkość pompy DC.
              {% elif water_d | float > 7.5 %}
              - 🟡 **Duża Delta T wody ({{ water_d }} °C):** Słaby przepływ — wyczyść filtr siatkowy lub zwiększ przepływ, inaczej spada sprawność (COP).
              {% else %}
              - 🟢 **Delta T wody ({{ water_d }} °C):** Dobra wymiana ciepła w instalacji.
              {% endif %}
              {% endif %}
              {% if heat_h or hw_h %}
              - 🔴 **Grzałka elektryczna WŁĄCZONA (COP = 1)!** Obniż próg temp. zewn. *G05/G07* (np. do -12°C) i zwiększ opóźnienie *G06/G08* do 45–60 min.
              {% else %}
              - 🟢 **Grzałki szczytowe wyłączone:** Całe ciepło produkuje oszczędna sprężarka.
              {% endif %}
              {% if ch_h %}
              - ℹ️ **Grzałka tacy ociekowej aktywna:** Pobiera dodatkowo ok. 43 W, chroniąc odpływ przed zamarznięciem.
              {% endif %}
              {% if is_number(eco_d) %}
              - 📊 **Woda vs krzywa ECO:** różnica wynosi **{{ eco_d }} °C** (każdy 1°C niżej na zasilaniu CO obniża pobór prądu o ok. 2–3%).
              {% endif %}
              {% if is_number(coil_d) %}
              - ❄️ **Obciążenie szronem (Zewn. - Lamele):** **{{ coil_d }} °C** (0 °C = czyste lamele / defrost; wartości rosnące w stronę 8–10 °C oznaczają narastający szron).
              {% endif %}
              {% if is_number(def_dur) and def_dur | float > 0 %}
              - ⏱️ **Ostatni defrost:** trwał **{{ def_dur }} min**{% if is_number(def_int) and def_int | float > 0 %}, odstęp od poprzedniego: **{{ def_int }} min**{% endif %}. Zdrowy defrost trwa zwykle 3–5 min.
              {% endif %}

          - type: tile
            entity: sensor.sprsun_heat_pump_estimated_electrical_power_experimental
            name: Szacowany pobór mocy (eksp.)
            icon: mdi:flash
            color: amber
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_last_run_duration
            name: Czas cyklu sprężarki
            icon: mdi:timer-outline
            color: green
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_compressor_frequency
            name: Obroty sprężarki (Hz)
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_water_delta_t
            name: Delta T wody
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_eco_curve_setpoint_delta
            name: Woda vs Krzywa ECO
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_condenser_approach_temperature
            name: Approach skraplacza
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 2: Dźwignia 1 i 2 — Nastawy oszczędzania energii (Core)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Dźwignia 1 — Temperatury, Taktowanie i Grzałki
            heading_style: title
            icon: mdi:piggy-bank-outline

          - type: markdown
            text_only: true
            content: |-
              **Największe oszczędności bez ryzyka:**
              1. **Obniż zadaną CO (P01) i CWU (P04):** CWU 46–48°C zamiast 55°C daje ogromny skok sprawności (COP).
              2. **Zwiększ histerezę CO (P03) do 3–5°C**, jeśli sprężarka robi krótkie cykle (< 15 min).
              3. **Przyblokuj grzałki (G05–G08):** ustaw temp. zewnętrzną na `-10..-15°C` i opóźnienie `45–60 min`.
              4. **Pompa obiegowa (G02/G04):** w trybie *Normal/Demand* ustaw *G04* tak, by Delta T wynosiła ok. 4–5°C.

          - type: tile
            entity: number.sprsun_heat_pump_heating_setpoint
            name: Zadana CO (P01)
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.sprsun_heat_pump_heating_cooling_temp_diff
            name: Histereza CO (P03)
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_setpoint
            name: Zadana CWU (P04)
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.sprsun_heat_pump_hot_water_temp_diff
            name: Histereza CWU (P05)
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons

          - type: tile
            entity: select.sprsun_heat_pump_fan_mode
            name: Profil pracy (P07 Normal/Eco/Night)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_pump_thermostatic_cycle
            name: Min. postój sprężarki (G03)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_heating_heater_ambient_temp
            name: Próg grzałki CO (G05)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_heating_heater_delay
            name: Opóźnienie grzałki CO (G06)
            grid_options:
              columns: 6

          - type: tile
            entity: number.sprsun_heat_pump_hot_water_heater_ambient_temp
            name: Próg grzałki CWU (G07)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_hot_water_heater_delay
            name: Opóźnienie grzałki CWU (G08)
            grid_options:
              columns: 6

          - type: tile
            entity: select.sprsun_heat_pump_pump_work_mode
            name: Tryb pompy obiegowej (G02)
            grid_options:
              columns: 6
          - type: tile
            entity: number.sprsun_heat_pump_dc_pump_temp_differential
            name: Docelowa Delta T pompy (G04)
            grid_options:
              columns: 6

      # ------------------------------------------------------------------------
      # Sekcja 3: Dźwignia 3 — Optymalizacja Czasu i Częstotliwości Defrostu
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Dźwignia 2 — Czas i Częstotliwość Defrostu
            heading_style: title
            icon: mdi:snowflake-melt

          - type: markdown
            text_only: true
            content: |-
              Każdy defrost odbiera ciepło z domu, aby roztopić szron na zewnątrz. Cel: **odszraniać tylko wtedy, gdy lamel faktycznie zarasta, i kończyć zaraz po spłynięciu lodu**.
              - **Kiedy wchodzi defrost (częstotliwość)?** Sterownik sprawdza 3 warunki naraz: minął czas **H08/H11/H14** (np. 45 min), temp. lamel spadła poniżej **H03** (np. -4°C) ORAZ różnica `Zewn. - Lamele` przekroczyła **H07/H10/H13** (np. 10°C).
              - **Jak długo trwa (czas i strata ciepła)?** Kończy się, gdy lamel osiągnie **H04** (np. 15°C) lub po czasie **H05** (maks. 8 min), pracując z mocą **H01** (np. 70 Hz). Jeśli po defroście lamel strzela na 35–45°C i para bucha długo po stopieniu lodu, **H04** lub **H01** mogą być za wysokie.
              - **Uwaga na tryb wentylatora (P07):** W wilgotne dni wokół `0..+2°C` tryb *Night* (wolniejszy wentylator) szybciej wychładza lamel i może **zwiększać** liczbę defrostów!

          - type: tile
            entity: sensor.sprsun_heat_pump_coil_ambient_temperature_delta
            name: Różnica Zewn. - Lamele (przyrost szronu)
            icon: mdi:snowflake-alert
            color: cyan
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_coil_temperature
            name: Temp. lamel (próg H03/H04)
            grid_options:
              columns: 6

          - type: tile
            entity: sensor.sprsun_heat_pump_last_defrost_duration
            name: Czas trwania defrostu
            icon: mdi:timer-sand
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sprsun_heat_pump_defrost_interval
            name: Odstęp między defrostami
            icon: mdi:history
            color: indigo
            grid_options:
              columns: 6

          # Opcjonalne liczniki 24h (widoczne automatycznie po dodaniu helpers YAML)
          - type: tile
            entity: sensor.sprsun_defrost_count_24h
            name: Liczba defrostów (24h)
            icon: mdi:counter
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.sprsun_defrost_count_24h
                above: -1

          - type: tile
            entity: sensor.sprsun_defrost_time_24h
            name: Łączny czas defrostów (24h)
            icon: mdi:clock-alert-outline
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.sprsun_defrost_time_24h
                above: -1

          - type: tile
            entity: sensor.sprsun_compressor_starts_24h
            name: Starty sprężarki (24h)
            icon: mdi:restart
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.sprsun_compressor_starts_24h
                above: -1

          - type: tile
            entity: sensor.sprsun_heaters_time_24h
            name: Czas grzałek elektrycznych (24h)
            icon: mdi:radiator-disabled
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.sprsun_heaters_time_24h
                above: -1

      # ------------------------------------------------------------------------
      # Sekcja 4 (szeroka): Wykres analizy szronienia i efektywności
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Wykresy do strojenia defrostu i krzywej mocy (24h)
            heading_style: title
            icon: mdi:chart-line

          - type: history-graph
            title: Narastanie szronu (Zewn. - Lamele), Temp. zewn. i Defrost (24h)
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.sprsun_heat_pump_coil_ambient_temperature_delta
                name: Obciążenie szronem (Zewn. - Lamele °C)
              - entity: sensor.sprsun_heat_pump_filtered_ambient_temperature
                name: Zewnętrzna odfiltr. (°C)
              - entity: binary_sensor.sprsun_heat_pump_defrost_active
                name: Defrost aktywny

          - type: history-graph
            title: Temp. lamel parownika (Cewka), Obroty (Hz) i Defrost (24h)
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.sprsun_heat_pump_coil_temperature
                name: Temp. lamel / cewki (°C)
              - entity: sensor.sprsun_heat_pump_compressor_frequency
                name: Sprężarka (Hz)
              - entity: binary_sensor.sprsun_heat_pump_defrost_active
                name: Defrost aktywny

          - type: history-graph
            title: Szacowana moc (W), Delta T wody (°C) i Odstęp defrostu (min) (24h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.sprsun_heat_pump_estimated_electrical_power_experimental
                name: Szacowana moc (W)
              - entity: sensor.sprsun_heat_pump_water_delta_t
                name: Delta T wody (°C)
              - entity: sensor.sprsun_heat_pump_defrost_interval
                name: Odstęp defrostu (min)

      # ------------------------------------------------------------------------
      # Sekcja 5 (Ekspercka — ukryta dopóki enable_expert_writes == False)
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        visibility:
          - condition: numeric_state
            entity: number.sprsun_heat_pump_h01_defrost_frequency
            above: 0
        cards:
          - type: heading
            heading: "[EKSPERT] Strojenie Defrostu (H01–H18), Pompy (F13–F17) i Częstotliwości (R)"
            heading_style: title
            icon: mdi:wrench-cog

          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              ⚠️ **Strefa parametrów fabrycznych (EEPROM):** Zmiany wprowadzaj **pojedynczo o mały krok** (np. ±1°C lub ±10 min) i obserwuj wykresy przez 24h. Zbyt rzadki lub zbyt krótki defrost przy dużej wilgotności może całkowicie zalodzić parownik!
              - **Rzadszy defrost (mniej strat):** delikatnie zwiększ `H08/H11/H14` (np. 45 -> 60 min) lub `H07/H10/H13` (np. 10 -> 11–12°C), jeśli na wykresie `Zewn. - Lamele` wchodzi zbyt wcześnie na czystych lamelach.
              - **Krótszy / łagodniejszy defrost:** sprawdź czy po stopieniu lodu `Lamele` nie przegrzewają się powyżej `30–40°C` — wówczas można lekko obniżyć `H04` (np. 15 -> 12–13°C) lub `H01` (np. 70 -> 55–60 Hz).

          - type: heading
            heading: Częstotliwość wejścia w defrost (H03, H07–H16, 0x00DB)
            heading_style: subtitle


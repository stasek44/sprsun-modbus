# ==============================================================================
# SPRSUN Heat Pump - Management Control Card (100% Native Home Assistant)
# ==============================================================================
# Ta karta zapewnia pełne, interaktywne sterowanie pompą ciepła SPRSUN przy użyciu
# wyłącznie wbudowanych kart Home Assistant (brak zależności od HACS / custom cards).
#
# Zawiera interaktywne przyciski [+] i [-] do bezpośredniej zmiany nastaw temperatur
# oraz histerezy CO i CWU bez konieczności wchodzenia w szczegóły encji.
#
# INSTRUKCJA UŻYCIA:
# 1. W Home Assistant przejdź do swojego pulpitu (Dashboard).
# 2. Kliknij "Edytuj pulpit" (Edit Dashboard) w prawym górnym rogu.
# 3. Kliknij "Dodaj kartę" (Add Card) i wybierz "Ręczna karta" (Manual).
# 4. Skopiuj i wklej całą poniższą zawartość.
# 5. Jeśli nazwa Twojego urządzenia to nie "heat_pump", użyj Ctrl+F i zamień
#    "heat_pump" na prefiks swoich encji (np. "sprsun" lub "pompa_ciepla").
# ==============================================================================

type: vertical-stack
title: Pompa Ciepła SPRSUN
cards:
  # ----------------------------------------------------------------------------
  # 1. ALARM I STATUS AWARYJNY (Wyświetlane automatycznie tylko w razie błędu)
  # ----------------------------------------------------------------------------
  - type: conditional
    conditions:
      - entity: binary_sensor.heat_pump_alarm_stop
        state: "on"
    card:
      type: tile
      entity: button.heat_pump_failure_reset
      name: "⚠️ AWARIA POMPY! Kliknij, aby zresetować błąd"
      icon: mdi:alert-octagon
      color: red

  # ----------------------------------------------------------------------------
  # 2. GŁÓWNE STEROWANIE: Zasilanie i Tryb Pracy jednostki (P06)
  # ----------------------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: tile
        entity: switch.heat_pump_power
        name: Zasilanie pompy
        icon: mdi:power
        color: green

      - type: tile
        entity: select.heat_pump_unit_mode
        name: Tryb pracy (P06)
        icon: mdi:heat-pump

  # ----------------------------------------------------------------------------
  # 3. OGRZEWANIE DOMU (CO) - Zadana temperatura (P01) oraz Histereza (P03)
  # ----------------------------------------------------------------------------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: number.heat_pump_heating_setpoint
        name: Zadana CO (P01)
        icon: mdi:radiator
        color: orange
        features:
          - type: numeric-input
            style: buttons

      - type: tile
        entity: number.heat_pump_heating_cooling_temp_diff
        name: Histereza CO (P03)
        icon: mdi:arrow-expand-vertical
        color: deep-orange
        features:
          - type: numeric-input
            style: buttons

  # ----------------------------------------------------------------------------
  # 4. CIEPŁA WODA UŻYTKOWA (CWU) - Zadana temperatura (P04) oraz Histereza (P05)
  # ----------------------------------------------------------------------------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: number.heat_pump_hot_water_setpoint
        name: Zadana CWU (P04)
        icon: mdi:water-boiler
        color: red
        features:
          - type: numeric-input
            style: buttons

      - type: tile
        entity: number.heat_pump_hot_water_temp_diff
        name: Histereza CWU (P05)
        icon: mdi:arrow-expand-vertical
        color: deep-orange
        features:
          - type: numeric-input
            style: buttons

  # ----------------------------------------------------------------------------
  # 5. CHŁODZENIE (P02) & TRYB WENTYLATORA (P07)
  # ----------------------------------------------------------------------------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: number.heat_pump_cooling_setpoint
        name: Zadana Chłodzenie (P02)
        icon: mdi:snowflake
        color: cyan
        features:
          - type: numeric-input
            style: buttons

      - type: tile
        entity: select.heat_pump_fan_mode
        name: Wentylator (P07)
        icon: mdi:fan
        color: teal

  # ----------------------------------------------------------------------------
  # 6. KLUCZOWE TEMPERATURY NA ŻYWO & EFEKTYWNOŚĆ (COP)
  # ----------------------------------------------------------------------------
  - type: glance
    title: Temperatury w układzie
    show_name: true
    show_state: true
    entities:
      - entity: sensor.heat_pump_inlet_water_temperature
        name: Powrót CO
        icon: mdi:water-arrow-left
      - entity: sensor.heat_pump_outlet_water_temperature
        name: Zasilanie CO
        icon: mdi:water-arrow-right
      - entity: sensor.heat_pump_hot_water_temperature
        name: Zasobnik CWU
        icon: mdi:water-boiler
      - entity: sensor.heat_pump_ambient_temperature
        name: Na zewnątrz
        icon: mdi:thermometer
      - entity: sensor.heat_pump_cop
        name: Aktualny COP
        icon: mdi:gauge

  # ----------------------------------------------------------------------------
  # 7. STATUS PRACY PODZESPOŁÓW
  # ----------------------------------------------------------------------------
  - type: glance
    title: Stan pracy podzespołów
    show_name: true
    show_state: true
    entities:
      - entity: binary_sensor.heat_pump_compressor
        name: Sprężarka
        icon: mdi:engine
      - entity: binary_sensor.heat_pump_defrost_active
        name: Odszranianie
        icon: mdi:snowflake-melt
      - entity: binary_sensor.heat_pump_circulation_pump
        name: Pompa obieg.
        icon: mdi:pump
      - entity: binary_sensor.heat_pump_3_way_valve
        name: Zawór 3-dr.
        icon: mdi:valve
      - entity: sensor.heat_pump_compressor_frequency
        name: Częstotliwość
        icon: mdi:sine-wave
